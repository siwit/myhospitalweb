<!doctype html>
<html lang="th">

<title>โรงพยาบาล 3D จากแผนผัง</title>

<style>
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --teal:#38C2B2; --teal-soft:#16403B; --free:#45CC8B; --free-soft:#173D2C; --mid:#F0B547; --mid-soft:#45361A; --full:#F27B73; --full-soft:#4A2321; --shadow:0 8px 28px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --bg:#0F1E1C; --panel:rgba(22,40,37,.94); --ink:#E3F1EE; --muted:#93AEA9; --line:#2A4440;
  --teal:#38C2B2; --teal-soft:#16403B; --free:#45CC8B; --free-soft:#173D2C; --mid:#F0B547; --mid-soft:#45361A; --full:#F27B73; --full-soft:#4A2321; --shadow:0 8px 28px rgba(0,0,0,.35);}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.ui{position:absolute;inset:0;pointer-events:none}
.panel{pointer-events:auto;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px 0 8px;min-width:0}
.cross{flex:none;width:32px;height:32px;border-radius:9px;background:var(--teal);display:grid;place-items:center}
.bname{font-weight:700;font-size:14.5px;line-height:1.15;white-space:nowrap}
.bsub{font-size:11.5px;color:var(--muted);white-space:nowrap}
.search{flex:1 1 200px;display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;min-width:0}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);flex:1;min-width:0;outline:none}
.search input::placeholder{color:var(--muted)}
.live{height:46px;display:flex;align-items:center;gap:7px;padding:0 13px;font-size:13.5px;font-weight:700;color:var(--free);font-variant-numeric:tabular-nums}
.live i{width:7px;height:7px;border-radius:50%;background:var(--free);box-shadow:0 0 0 3px var(--free-soft)}
.kpis{flex:1 1 100%;display:flex;gap:8px;pointer-events:none}
.kpi{padding:8px 13px 9px;display:flex;flex-direction:column;gap:1px;min-width:130px}
.kl{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.kv{display:flex;align-items:baseline;gap:6px}
.kv b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.kv small{font-size:12px;color:var(--muted);font-weight:600}
.lvl{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.lv0{background:var(--free-soft);color:var(--free)}.lv1{background:var(--mid-soft);color:var(--mid)}.lv2{background:var(--full-soft);color:var(--full)}
.ctrls{position:absolute;right:12px;top:47%;transform:translateY(-50%);display:flex;flex-direction:column;padding:4px;gap:2px}
.ctrls button{width:38px;height:38px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.ctrls button:hover{background:var(--teal-soft)}
.ctrls hr{border:0;height:1px;background:var(--line);margin:3px 6px}
.bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:flex-end}
.card{flex:1 1 auto;max-width:560px;padding:14px 16px}
.empty{font-size:13.5px;color:var(--muted);line-height:1.6}
.empty b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--ink)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}
.chead{display:flex;align-items:center;gap:12px}
.qno{flex:none;min-width:58px;height:46px;padding:0 8px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;font-variant-numeric:tabular-nums}
.ct{flex:1;min-width:0}
.ctitle{font-weight:700;font-size:15px}
.csub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--teal-soft);color:var(--teal);max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge.ok{background:var(--free-soft);color:var(--free)}.badge.warn{background:var(--mid-soft);color:var(--mid)}.badge.bad{background:var(--full-soft);color:var(--full)}
.steps{list-style:none;margin:14px 0 2px;padding:0;display:grid}
.steps li{position:relative;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.3}
.steps li::before{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.cur::before{background:var(--teal)}
.steps .dot{position:relative;display:block;width:20px;height:20px;margin:0 auto 5px;border-radius:50%;background:var(--panel);border:2px solid var(--line)}
.steps li.done .dot{background:var(--teal);border-color:var(--teal)}
.steps li.cur .dot{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.steps li.cur{color:var(--ink);font-weight:700}
.cmeta{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.cmeta b{color:var(--ink);font-weight:600}
.cact{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cact:empty{display:none}
.cact button{border:1px solid var(--teal);background:var(--teal);color:#fff;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:10px;cursor:pointer}
.cact button.ghost{background:transparent;color:var(--teal)}
.cact button:disabled{opacity:.4;cursor:default}
.zones{width:340px;padding:12px;margin-left:auto}
.zhead{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;flex-wrap:wrap}
.zhead b{font-weight:700;margin-right:auto}
.sw-l{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;cursor:pointer;user-select:none}
.sw-l input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw-l input:checked+.sw{background:var(--teal)}
.sw-l input.rush:checked+.sw{background:var(--full)}
.sw-l input:checked+.sw::after{transform:translateX(12px)}
.sw-l input:focus-visible+.sw{outline:2px solid var(--teal);outline-offset:2px}
.zlist{display:flex;flex-direction:column;gap:3px;max-height:250px;overflow:auto}
.zrow{display:grid;grid-template-columns:1fr auto;gap:3px 8px;width:100%;padding:6px 8px;border:1px solid transparent;background:transparent;border-radius:10px;cursor:pointer;text-align:left}
.zrow:hover{background:var(--teal-soft)}
.zrow.sel{border-color:var(--teal);background:var(--teal-soft)}
.zn{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar{grid-column:1/-1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.zl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:11.5px;font-weight:600;white-space:nowrap;box-shadow:0 3px 10px rgba(20,70,62,.12)}
.zl em{font-style:normal;font-weight:700;font-size:11px;padding:1px 6px;border-radius:99px;font-variant-numeric:tabular-nums}
.zl.room{background:transparent;border:0;box-shadow:none;color:var(--ink);font-weight:600;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.tag{position:absolute;left:0;top:0;background:var(--teal);color:#fff;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;display:none;box-shadow:0 4px 12px rgba(14,140,127,.35)}
.toast{position:absolute;left:50%;top:128px;transform:translate(-50%,-6px);opacity:0;transition:opacity .25s,transform .25s;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:9px 14px;border-radius:12px;pointer-events:none;max-width:calc(100% - 24px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:720px){
  .brand{flex:1 1 100%;order:-1}
  .search{flex:1 1 0;height:40px}
  .live{height:40px}
  .kpi{flex:1 1 0;min-width:0;padding:7px 10px 8px}
  .hide-m{display:none!important}
  .kv b{font-size:17px}
  .toast{top:176px}
  .ctrls button{width:34px;height:34px}
  .bottom{flex-direction:column;align-items:stretch;gap:8px}
  .zones{width:auto;margin:0;padding:10px}
  .zlist{flex-direction:row;overflow-x:auto;max-height:none;scrollbar-width:none}
  .zlist::-webkit-scrollbar{display:none}
  .zrow{flex:none;width:150px}
  .card{max-width:none;padding:12px 14px}
  .zl{font-size:10px;padding:2px 6px}
}
@media (prefers-reduced-motion: reduce){.toast,.sw,.sw::after,.bar i{transition:none}}
</style>
</head>

/* exact geometry: distance from point to wall segment, and segment-vs-walls clearance */
function ptSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=t<0?0:t>1?1:t;return Math.hypot(px-ax-t*dx,py-ay-t*dy);}

function crosses(a,b,w){const o=(p,q,rx,ry)=>(q[0]-p[0])*(ry-p[1])-(q[1]-p[1])*(rx-p[0]);
  const d1=o(a,b,w[0],w[1]),d2=o(a,b,w[2],w[3]),d3=(w[2]-w[0])*(a[1]-w[1])-(w[3]-w[1])*(a[0]-w[0]),d4=(w[2]-w[0])*(b[1]-w[1])-(w[3]-w[1])*(b[0]-w[0]);
  return d1*d2<0&&d3*d4<0;}
function clear(a,b,r){for(const w of WALLS){if(crosses(a,b,w))return false;if(r>0&&(ptSeg(w[0],w[1],a[0],a[1],b[0],b[1])<r||ptSeg(w[2],w[3],a[0],a[1],b[0],b[1])<r||ptSeg(a[0],a[1],w[0],w[1],w[2],w[3])<r||ptSeg(b[0],b[1],w[0],w[1],w[2],w[3])<r))return false;}return true;}
/* a cell is walkable only if a person (radius ~3.3 px) standing at its centre stays clear of the wall */
const BODY=3.6;
for(let cy=0;cy<GH;cy++)for(let cx=0;cx<GW;cx++){const x=(cx+.5)*CS,y=(cy+.5)*CS;if(x<80||x>1290||y<-20||y>800)continue;if(wallDist(x,y)<BODY)blocked[gi(cx,cy)]=1;}
for(let cy=1;cy<GH-1;cy++)for(let cx=1;cx<GW-1;cx++){if(blocked[gi(cx,cy)])continue;for(let dy=-1;dy<=1&&!nearW[gi(cx,cy)];dy++)for(let dx=-1;dx<=1;dx++)if(blocked[gi(cx+dx,cy+dy)]){nearW[gi(cx,cy)]=1;break;}}
/* nearest walkable cell that can be reached from (x,y) without crossing a wall */
function freeNear(x,y){
  const cx=clamp(Math.floor(x/CS),0,GW-1),cy=clamp(Math.floor(y/CS),0,GH-1);
  let best=null,bd=1e9;
  for(let r=0;r<10;r++){
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const nx=cx+dx,ny=cy+dy;
      if(nx<0||ny<0||nx>=GW||ny>=GH||blocked[gi(nx,ny)])continue;
      const px=(nx+.5)*CS,py=(ny+.5)*CS,d=Math.hypot(px-x,py-y);
      if(d<bd&&clear([x,y],[px,py],0)){bd=d;best=[nx,ny];}
    }
    if(best&&bd<=(r+0.5)*CS)break;
  }
  return best||[cx,cy];

const gScore=new Float32Array(GW*GH),came=new Int32Array(GW*GH),seen=new Uint32Array(GW*GH),shut=new Uint32Array(GW*GH);let stamp=0;
function astar(sx,sy,tx,ty){
  const s=freeNear(sx,sy),t=freeNear(tx,ty),S=gi(s[0],s[1]),T=gi(t[0],t[1]);
  stamp++;const heap=[];const push=(n,f)=>{heap.push([f,n]);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p;}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m;}}return top[1];};
  const h=n=>{const dx=Math.abs(n%GW-t[0]),dy=Math.abs((n/GW|0)-t[1]);return(Math.max(dx,dy)+0.414*Math.min(dx,dy))*1.2;};
  seen[S]=stamp;gScore[S]=0;came[S]=-1;push(S,h(S));let iter=0;
  while(heap.length&&iter++<200000){
    const n=pop();if(n===T)break;if(shut[n]===stamp)continue;shut[n]=stamp;
    const nx=n%GW,ny=n/GW|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;const x=nx+dx,y=ny+dy;if(x<0||y<0||x>=GW||y>=GH)continue;
      const m=gi(x,y);if(blocked[m])continue;
      if(dx&&dy&&(blocked[gi(nx+dx,ny)]||blocked[gi(nx,ny+dy)]))continue;
      const g=gScore[n]+(dx&&dy?1.414:1)*(nearW[m]?2.2:1);
      if(seen[m]!==stamp||g<gScore[m]){seen[m]=stamp;gScore[m]=g;came[m]=n;push(m,g+h(m));}
    }
  }
  const tgt=[tx,ty];
  if(seen[T]!==stamp)return[tgt];
  const cells=[[sx,sy]];const rev=[];for(let n=T;n!==-1;n=came[n])rev.push([(n%GW+0.5)*CS,((n/GW|0)+0.5)*CS]);
  for(let i=rev.length-1;i>=0;i--)cells.push(rev[i]);cells.push(tgt);

  const rEnd=clamp(Math.min(wallDist(sx,sy),wallDist(tx,ty))-0.3,0.3,BODY-0.4);

    let j=i+1;
    while(j+1<cells.length&&clear(cells[i],cells[j+1],(j+1===cells.length-1||i===0)?rEnd:BODY-0.4))j++;
    out.push(cells[j]);i=j;
  }
  return out;
}

    x:0,y:0,wps:[],onArrive:null,zone:null,slot:null,station:null,bed:null,mode:'walk',svcT:0,waitStart:0,arrival:T,vitals:null,phase:Math.random()*6,lying:false};
  const e=t.key==='pcu'?ENTRY_PCU:t.key==='er'?ENTRY_ER:ENTRY_MAIN;p.x=e[0]+rand(-6,6);p.y=e[1]+rand(-6,6);p.exitPt=e;

const LIE_OFF=0.95;
function setSit(p,on){p.g.userData.legs.visible=!on;p.g.position.y=on?0.05:0;}
function nextStage(p){
  p.ri++;const key=p.route[p.ri];setSit(p,false);if(p.lying)setLie(p,false);
  if(key==='exit'){p.zone=null;p.mode='exit';goTo(p,p.exitPt[0],p.exitPt[1],()=>{scene.remove(p.g);patients.splice(patients.indexOf(p),1);served++;if(selected===p)select(null);});return;}
  if(key==='ipd'){
    const b=beds.find(b=>!b.p);p.zone=null;
    if(!b){p.route.splice(p.ri,1,'pha');p.ri--;nextStage(p);return;}
    b.p=p;p.bed=b;p.mode='walk';p.admitTo=b.ward;
    goTo(p,b.x,b.y+4,()=>{p.mode='admit';p.svcT=rand(60,140);setLie(p,true);p.g.position.x=WX(b.x);p.g.position.z=WZ(b.y)+LIE_OFF;});
    return;
  }
  const z=ZMAP[key];p.zone=z;p.mode='walk';z.queue.push(p);p.arrived=false;
  const s=z.slots.find(s=>!s.p);let tx,ty;
  if(s){s.p=p;p.slot=s;tx=s.x;ty=s.y;}else{tx=rand(z.wait[0],z.wait[2]);ty=rand(z.wait[1],z.wait[3]);}

function serve(z,dt){
  z.stations.forEach(st=>{
    if(st.p){const p=st.p;if(p.mode==='svc'){p.svcT-=dt;if(p.svcT<=0){st.p=null;p.station=null;z.served++;if(st.closing){st.open=false;st.closing=false;st.staff.visible=false;}nextStage(p);}}return;}
    if(!st.open)return;
    const p=z.queue.find(q=>q.arrived);if(!p)return;
    z.queue.splice(z.queue.indexOf(p),1);if(p.slot){p.slot.p=null;p.slot=null;}setSit(p,false);
    const w=T-p.waitStart;z.waits.push(w);if(z.waits.length>14)z.waits.shift();
    st.p=p;p.station=st;p.mode='call';
    goTo(p,st.x,st.y,()=>{p.mode='svc';p.svcT=rand(z.svc[0],z.svc[1]);p.g.rotation.y=Math.atan2(z.sd[0],z.sd[1]);
      if(z.key==='scr'||z.key==='pcu'||z.key==='anc')p.vitals={wt:p.age<12?randi(10,40):randi(42,95),bp:randi(104,152)+'/'+randi(62,94)};
      if(z.beds){setLie(p,true);p.g.position.x=WX(st.x);p.g.position.z=WZ(st.y)+LIE_OFF;}});
  });
}
function move(p,dt){
  if(p.mode==='admit'){p.svcT-=dt;if(p.svcT<=0){p.bed.p=null;p.bed=null;setLie(p,false);nextStage(p);}return;}
  if(!p.wps.length||p.lying)return;
  const tg=p.wps[0],dx=tg[0]-p.x,dy=tg[1]-p.y,d=Math.hypot(dx,dy),step=40*dt;
  if(d<=step){p.x=tg[0];p.y=tg[1];p.wps.shift();sync(p);p.g.position.y=0;if(!p.wps.length){const cb=p.onArrive;p.onArrive=null;cb&&cb();}return;}
  p.x+=dx/d*step;p.y+=dy/d*step;sync(p);p.phase+=dt*11;p.g.position.y=Math.abs(Math.sin(p.phase))*0.07;
  const want=Math.atan2(dx,dy);let df=want-p.g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));p.g.rotation.y+=df*Math.min(1,dt*12);
}
function density(z){return z.queue.length/Math.max(4,z.slots.length);}
const levelOf=r=>r<0.45?0:r<0.8?1:2;
function tick(dt,quiet){
  T+=dt;spawnT-=dt;
  if(spawnT<=0){spawnT=$('#rush').checked?rand(0.6,1.0):rand(1.7,2.7);if(patients.length<170)spawn();}
  erT-=dt;if(erT<=0&&ambState.mode==='park'){erT=rand(35,60)/($('#rush').checked?1.6:1);ambState.mode='in';ambState.t=0;}
  if(ambState.mode==='in'){ambState.t+=dt;amb.position.x=WX(520)+(1-Math.min(1,ambState.t/3))*-14;if(ambState.t>3.2){ambState.mode='unload';ambState.t=0;const p=spawn(TYPES[6]);if(!quiet)toast('รถพยาบาลมาถึง ER ผู้ป่วยฉุกเฉิน '+p.code);}}
  else if(ambState.mode==='unload'){ambState.t+=dt;if(ambState.t>6)ambState.mode='park';}
  ZONES.forEach(z=>serve(z,dt));
  for(let i=patients.length-1;i>=0;i--)move(patients[i],dt);
  ZONES.forEach(z=>{const lv=levelOf(density(z));if(lv===2&&z.lvl<2&&!quiet&&T-z.lastToast>25){z.lastToast=T;toast(z.name+' หนาแน่น มีผู้รอ '+z.queue.length+' คน');}z.lvl=lv;});
}

const tv=new THREE.Vector3(),ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function scr(v){tv.copy(v).project(cam);return{x:(tv.x+1)/2*stage.clientWidth,y:(1-tv.y)/2*stage.clientHeight};}
function pick(e){
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  let best=null,bd=24;
  patients.forEach(p=>{const s=scr(tv.set(p.g.position.x,1,p.g.position.z));const d=Math.hypot(s.x-mx,s.y-my);if(d<bd){bd=d;best=p;}});
  if(best){select(best);return;}
  if($('#pcs').checked){let bp=null,bpd=20;pcs.forEach(p=>{const s=scr(tv.set(p.g.position.x,1,p.g.position.z));const d=Math.hypot(s.x-mx,s.y-my);if(d<bpd){bpd=d;bp=p;}});if(bp){selectPc(bp);return;}}
  ndc.set(mx/r.width*2-1,-(my/r.height)*2+1);ray.setFromCamera(ndc,cam);
  const hit=ray.intersectObjects(ZONES.map(z=>z.floor))[0];
  if(hit){selectZone(hit.object.userData.ref,false);return;}
  select(null);
}

    if(sig!==actSig){actSig=sig;const a=$('#cAct');a.innerHTML='';
      const add=document.createElement('button');add.textContent='เปิดจุดบริการเพิ่ม';add.disabled=openN>=z.stations.length;
      add.onclick=()=>{const s=z.stations.find(s=>!s.open||s.closing);if(s){s.open=true;s.closing=false;s.staff.visible=true;toast('เปิด '+z.name+' เพิ่ม 1 จุด');actSig='';updateUI();}};
      const rm=document.createElement('button');rm.className='ghost';rm.textContent='ปิด 1 จุด';rm.disabled=openN<=1;
      rm.onclick=()=>{const s=[...z.stations].reverse().find(s=>s.open&&!s.closing);if(s){if(s.p)s.closing=true;else{s.open=false;s.staff.visible=false;}toast('ปิด '+z.name+' 1 จุด');actSig='';updateUI();}};
      a.append(add,rm);}
  }else actSig='';
  if(!z)q.style.fontSize='';
}
$('#rush').addEventListener('change',e=>toast(e.target.checked?'ช่วงเร่งด่วน ผู้ป่วยมาเพิ่มเกือบ 3 เท่า':'กลับสู่ช่วงปกติ'));
$('#pcs').addEventListener('change',e=>{applyPcs(e.target.checked);if(!e.target.checked&&selPc)select(null);});
$('#q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;const raw=e.target.value.trim(),q=raw.toLowerCase().replace(/\s|-/g,'');if(!q)return;
  const pc=pcs.find(p=>p.id.toLowerCase().replace('-','')===q);if(pc){selectPc(pc);view.goal={tx:pc.g.position.x,tz:pc.g.position.z,zoom:3};e.target.blur();return;}
  const z=ZONES.find(z=>z.name.toLowerCase().replace(/\s/g,'').includes(q)||z.key===q);if(z){selectZone(z,true);e.target.blur();return;}
  const l=LABELS.find(l=>l[0].toLowerCase().replace(/\s/g,'').includes(q));if(l){view.goal={tx:WX(l[1]),tz:WZ(l[2]),zoom:2.6};e.target.blur();return;}
  const p=patients.find(p=>p.code.toLowerCase()===q||p.hn.toLowerCase().replace(/\s|-/g,'').includes(q));
  if(p){select(p);view.goal={tx:p.g.position.x,tz:p.g.position.z,zoom:3};e.target.blur();}else toast('ไม่พบ "'+raw+'"');
});
const tag=$('#tag');
function placeOverlays(){
  const w=stage.clientWidth,h=stage.clientHeight,showRooms=view.zoom>0.85;
  roomLabels.forEach(l=>{if(!showRooms){l.el.style.display='none';return;}const s=scr(l.v);l.el.style.display='block';l.el.style.transform='translate('+s.x+'px,'+s.y+'px) translate(-50%,-50%)';});
  ZONES.forEach(z=>{const s=scr(z.lv);const show=view.zoom>1.3||z.lvl>0;z.label.style.display=show?'flex':'none';z.label.style.transform='translate('+s.x+'px,'+s.y+'px) translate(-50%,-50%)';});
  if(selected){const g=selected.g.position;ring.position.set(g.x,0.12,g.z);const s=scr(tv.set(g.x,selected.lying?2.2:3.2,g.z));tag.style.display='block';tag.textContent=selected.code+'  '+statusText(selected);tag.style.transform='translate('+s.x+'px,'+s.y+'px) translate(-50%,-100%)';}
  else if(selPc){const s=scr(tv.set(selPc.g.position.x,2.2,selPc.g.position.z));tag.style.display='block';tag.textContent=selPc.id+'  '+selPc.room;tag.style.transform='translate('+s.x+'px,'+s.y+'px) translate(-50%,-100%)';}
  else tag.style.display='none';
}

/* warm-up and loop */
for(let i=0;i<900;i++)tick(0.1,true);
ZONES.forEach(z=>z.mat.color.setHex(P.tint[z.lvl]));
let last=performance.now(),uiT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  tick(dt,false);tint(dt);
  if(view.goal){const g=view.goal,k=Math.min(1,dt*4);view.tx+=(g.tx-view.tx)*k;view.tz+=(g.tz-view.tz)*k;view.zoom+=(g.zoom-view.zoom)*k;if(Math.abs(g.tx-view.tx)<0.05&&Math.abs(g.zoom-view.zoom)<0.01)view.goal=null;}
  view.az+=(view.azT-view.az)*Math.min(1,dt*7);
  updateCam();renderer.render(scene,cam);placeOverlays();
  uiT+=dt;if(uiT>0.3){uiT=0;updateUI();}
  requestAnimationFrame(frame);
}
resize();updateUI();requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
